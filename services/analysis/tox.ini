[tox]
min_version = 4.0
envlist = format,lint,typing,security,tests,coverage
isolated_build = True
skip_missing_interpreters = true

[tox_env_defaults]
passenv =
    CI
    GITHUB_ACTIONS
    PYTEST_ADDOPTS

[testenv:format]
description = Check code formatting with black and import ordering with isort
deps =
    black>=24.0
    isort>=5.13
commands =
    black --check --diff {toxinidir}/app/ {toxinidir}/workers/ {toxinidir}/tests/
    isort --check-only --diff {toxinidir}/app/ {toxinidir}/workers/ {toxinidir}/tests/

[testenv:format-fix]
description = Auto-fix code formatting and import ordering
deps =
    black>=24.0
    isort>=5.13
commands =
    black {toxinidir}/app/ {toxinidir}/workers/ {toxinidir}/tests/
    isort {toxinidir}/app/ {toxinidir}/workers/ {toxinidir}/tests/

[testenv:lint]
description = Run flake8 with all plugins for comprehensive linting
deps =
    flake8>=7.0
    flake8-bugbear>=24.0
    flake8-builtins>=2.2
    flake8-comprehensions>=3.14
    flake8-docstrings>=1.7
    flake8-import-order>=0.18
    pep8-naming>=0.14
commands =
    flake8 {toxinidir}/app/ {toxinidir}/workers/ {toxinidir}/tests/

[testenv:typing]
description = Run mypy static type checking in strict mode
deps =
    mypy>=1.8
    types-requests>=2.31
    typing-extensions>=4.9
    pydantic>=2.0
commands =
    mypy {toxinidir}/app/ {toxinidir}/workers/

[testenv:security]
description = Scan for security vulnerabilities with bandit and pip-audit
deps =
    bandit>=1.7
commands =
    bandit -r {toxinidir}/app/ -x {toxinidir}/app/tests/

[testenv:tests]
description = Run test suite with pytest
deps =
    pytest>=8.0
    pytest-cov>=5.0
    pytest-mock>=3.12
    pytest-xdist>=3.5
    httpx>=0.25
    factory-boy>=3.3
    faker>=22.0
commands =
    pytest {toxinidir}/tests/ -n auto --dist loadscope {posargs}

[testenv:coverage]
description = Run tests with coverage and generate HTML report
deps =
    {[testenv:tests]deps}
commands =
    pytest {toxinidir}/tests/ --cov={toxinidir}/app/ --cov={toxinidir}/workers/ --cov-report=term-missing --cov-report=html:{toxinidir}/htmlcov/
    python -c "import webbrowser; webbrowser.open('{toxinidir}/htmlcov/index.html')"
