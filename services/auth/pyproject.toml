[project]
name = "auth"
version = "0.1.0"
description = "Auth service — OAuth, JWT, user management, and API keys"
requires-python = ">=3.11"
dependencies = [
    "django>=4.2",
    "djangorestframework>=3.14",
    "django-cors-headers>=4.0",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "celery>=5.3",
    "djangorestframework-simplejwt>=5.3",
    "social-auth-app-django>=5.0",
    "argon2-cffi>=25.1.0",
    "django-environ>=0.13.0",
    "pyjwt>=2.8",
    "cryptography>=42.0.0",
    "dj-database-url>=3.1.2",
    "google-auth>=2.28.0",
    "gunicorn>=21.2.0",
    "confluent-kafka>=2.3",
    "boto3>=1.34",
    "django-storages>=1.14",
    "drf-spectacular>=0.29.0",
    "drf-spectacular-sidecar",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "flake8-bugbear>=24.0",
    "flake8-builtins>=2.2",
    "flake8-comprehensions>=3.14",
    "flake8-docstrings>=1.7",
    "flake8-import-order>=0.18",
    "pep8-naming>=0.14",
    "mypy>=1.8",
    "django-stubs>=4.2",
    "djangorestframework-stubs>=3.14",
    "pytest>=8.0",
    "pytest-django>=4.5",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "pytest-xdist>=3.5",
    "pytest-sugar>=1.1",
    "factory-boy>=3.3",
    "faker>=22.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.6",
    "tox>=4.14",
    "ruff>=0.3.0",
    "types-requests>=2.31",
    "typing-extensions>=4.9",
    "rich>=13.0",
]

[dependency-groups]
dev = [
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "flake8-bugbear>=24.0",
    "flake8-builtins>=2.2",
    "flake8-comprehensions>=3.14",
    "flake8-docstrings>=1.7",
    "flake8-import-order>=0.18",
    "pep8-naming>=0.14",
    "mypy>=1.8",
    "django-stubs>=4.2",
    "djangorestframework-stubs>=3.14",
    "pytest>=8.0",
    "pytest-django>=4.5",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "pytest-xdist>=3.5",
    "pytest-sugar>=1.1",
    "factory-boy>=3.3",
    "faker>=22.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.6",
    "tox>=4.14",
    "ruff>=0.3.0",
    "types-requests>=2.31",
    "typing-extensions>=4.9",
    "rich>=13.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]
skip-magic-trailing-comma = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_standard_library = ["typing", "collections", "dataclasses", "enum", "re", "json", "pathlib"]
known_third_party = ["django", "rest_framework", "corsheaders", "psycopg2", "redis", "celery", "social_core", "social_django", "environ", "pyjwt", "cryptography", "google", "gunicorn", "pytest", "factory"]
known_first_party = ["apps", "auth"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apps.*", "auth.*"]
ignore_missing_imports = false

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".ruff_cache", "apps/*/tests"]
skips = ["B101", "B105", "B106", "B110", "B301", "B403"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "auth.settings.test"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests", "apps"]
addopts = "-v --tb=short --strict-markers -p no:cacheprovider"
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require database or external services)",
    "security: Security-related tests",
    "auth: Authentication-specific tests",
    "token: Token-related tests",
    "slow: Tests that take longer than 5 seconds",
]
test_timeout = 120

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/admin.py",
    "*/oauth/*",
    "*/password_reset*",
    "*/otp.py",
    "*/email_service.py",
    "*/security.py",
    "*/consumers.py",
    "*/events.py",
    "*/tasks.py",
    "*/management/commands/*",
]
branch = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 87
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "ISC", "ICN"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N803"]
"apps/*/tests/*" = ["N803"]