[tox]
min_version = 4.0
envlist = format,lint,typing,security,tests,coverage
isolated_build = True
skip_missing_interpreters = true

[tox_env_defaults]
passenv =
    CI
    GITHUB_ACTIONS
    PYTEST_ADDOPTS
    DATABASE_URL
    REDIS_URL
    SECRET_KEY
    DJANGO_SETTINGS_MODULE

[testenv:format]
description = Check code formatting with black and import ordering with isort
deps =
    black>=24.0
    isort>=5.13
commands =
    black --check --diff {toxinidir}/apps/ {toxinidir}/core/ {toxinidir}/tests/
    isort --check-only --diff {toxinidir}/apps/ {toxinidir}/core/ {toxinidir}/tests/

[testenv:format-fix]
description = Auto-fix code formatting and import ordering
deps =
    black>=24.0
    isort>=5.13
commands =
    black {toxinidir}/apps/ {toxinidir}/core/ {toxinidir}/tests/
    isort {toxinidir}/apps/ {toxinidir}/core/ {toxinidir}/tests/

[testenv:lint]
description = Run flake8 with all plugins for comprehensive linting
deps =
    flake8>=7.0
    flake8-bugbear>=24.0
    flake8-builtins>=2.2
    flake8-comprehensions>=3.14
    flake8-docstrings>=1.7
    flake8-import-order>=0.18
    pep8-naming>=0.14
commands =
    flake8 {toxinidir}/apps/ {toxinidir}/core/ {toxinidir}/tests/

[testenv:typing]
description = Run mypy static type checking in strict mode
deps =
    mypy>=1.8
    django-stubs>=4.2
    djangorestframework-stubs>=3.14
    types-requests>=2.31
    typing-extensions>=4.9
commands =
    mypy {toxinidir}/apps/ {toxinidir}/core/

[testenv:security]
description = Scan for security vulnerabilities with bandit and pip-audit
deps =
    bandit>=1.7
commands =
    bandit -r {toxinidir}/apps/ -x {toxinidir}/apps/*/tests/

[testenv:tests]
description = Run test suite with pytest
deps =
    pytest>=8.0
    pytest-django>=4.12
    pytest-cov>=5.0
    pytest-mock>=3.12
    pytest-xdist>=3.5
    pytest-sugar>=1.1
    factory-boy>=3.3
    faker>=22.0
commands =
    django-admin check --settings=core.settings.test
    pytest {toxinidir}/tests/ {toxinidir}/apps/ -n auto --dist loadscope {posargs}

[testenv:coverage]
description = Run tests with coverage and generate HTML report
deps =
    {[testenv:tests]deps}
commands =
    pytest {toxinidir}/tests/ {toxinidir}/apps/ --cov={toxinidir}/apps/ --cov-report=term-missing --cov-report=html:{toxinidir}/htmlcov/
