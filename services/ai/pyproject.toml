[project]
name = "ai"
version = "0.1.0"
description = "AI service — LLM integration, agents, and RAG pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "celery>=5.3",
    "openai>=1.0",
    "anthropic>=0.8",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-community>=0.3",
    "langgraph>=0.2",
    "pyjwt>=2.13.0",
    "cryptography>=48.0.1",
    "httpx>=0.25",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sse-starlette>=2.0",
    "prometheus-client>=0.20",
    "structlog>=24.0",
    "sentence-transformers>=3.0",
    "duckduckgo-search>=6.0",
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
    "tiktoken>=0.7",
    "pgvector>=0.4.2",
    "aiohttp>=3.9",
    "aiokafka>=0.10",
    "google-generativeai>=0.7",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "flake8-bugbear>=24.0",
    "flake8-builtins>=2.2",
    "flake8-comprehensions>=3.14",
    "flake8-docstrings>=1.7",
    "flake8-import-order>=0.18",
    "pep8-naming>=0.14",
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "pytest-xdist>=3.5",
    "httpx>=0.25",
    "factory-boy>=3.3",
    "faker>=22.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.6",
    "tox>=4.14",
    "ruff>=0.3.0",
    "types-requests>=2.31",
    "typing-extensions>=4.9",
]

[dependency-groups]
dev = [
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "flake8-bugbear>=24.0",
    "flake8-builtins>=2.2",
    "flake8-comprehensions>=3.14",
    "flake8-docstrings>=1.7",
    "flake8-import-order>=0.18",
    "pep8-naming>=0.14",
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "pytest-xdist>=3.5",
    "httpx>=0.25",
    "factory-boy>=3.3",
    "faker>=22.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.6",
    "tox>=4.14",
    "ruff>=0.3.0",
    "types-requests>=2.31",
    "typing-extensions>=4.9",
]

[tool.black]
line-length = 88
target-version = ["py311"]
skip-magic-trailing-comma = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_standard_library = ["typing", "collections", "dataclasses", "enum", "re", "json", "pathlib"]
known_third_party = ["fastapi", "uvicorn", "sqlalchemy", "psycopg2", "redis", "celery", "openai", "anthropic", "langchain", "pyjwt", "cryptography", "httpx", "pydantic", "pytest"]
known_first_party = ["app"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.*"]
ignore_missing_imports = false

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".ruff_cache"]
skips = ["B101", "B105", "B106", "B110", "B301", "B403"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require database or services)",
    "slow: Tests that take longer than 5 seconds",
]
asyncio_mode = "auto"
test_timeout = 60

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/conftest.py",
]
branch = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "ISC", "ICN"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N803"]
