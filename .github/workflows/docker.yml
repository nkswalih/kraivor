name: Docker Validate

on:
  pull_request:
    paths:
      - "services/**/Dockerfile*"
      - "services/**/.dockerignore"
      - "docker-compose*"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, core, ai, analysis]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate Dockerfile exists
        working-directory: services/${{ matrix.service }}
        run: |
          if [ ! -f Dockerfile ]; then
            echo "::error::No Dockerfile found for ${{ matrix.service }}"
            exit 1
          fi

      - name: Docker build (no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: kraivor/${{ matrix.service }}:test
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # master
        with:
          scan-type: "fs"
          scan-ref: services/${{ matrix.service }}
          format: "sarif"
          output: services/${{ matrix.service }}/trivy-${{ matrix.service }}.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Check Trivy SARIF exists
        id: check-sarif
        run: |
          if [ -f "services/${{ matrix.service }}/trivy-${{ matrix.service }}.sarif" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Trivy SARIF
        if: steps.check-sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: services/${{ matrix.service }}/trivy-${{ matrix.service }}.sarif

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate docker-compose config
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose config --quiet || \
              echo "::error::docker-compose.yml has invalid configuration"
          fi
          if [ -f docker-compose.dev.yml ]; then
            docker compose -f docker-compose.dev.yml config --quiet || \
              echo "::error::docker-compose.dev.yml has invalid configuration"
          fi
