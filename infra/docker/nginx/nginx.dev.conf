events {
worker_connections 1024;
}

http {
# ========================================
# WebSocket upgrade helper
# ========================================
map $http_upgrade $connection_upgrade {
default upgrade;
'' close;
}

# ========================================
# Upstreams
# ========================================

upstream auth {
    server identity:8001;
}

upstream core {
    server core:8002;
}

# upstream analysis {
#     server analysis:8003;
# }

# upstream ai {
#     server ai:8004;
# }

# upstream notifications {
#     server notifications:8005;
# }

# upstream realtime {
#     server realtime:8006;
# }

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50M;

    # ========================================
    # AUTH SERVICE
    # ========================================

    location /api/auth/ {
        proxy_pass http://auth/api/auth/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;

        proxy_buffering off;
    }

    # ========================================
    # PROFILES SERVICE (inside auth)
    # ========================================

    location /api/profiles/ {
        proxy_pass http://auth/api/profiles/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;

        proxy_buffering off;
    }

    # ========================================
    # CORE SERVICE — workspaces, chat, notifications, knowledge, community
    # ========================================

    location /api/ {
        proxy_pass http://core/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    location /ws/ {
        proxy_pass http://core/ws/;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;

        proxy_buffering off;
    }

    # ========================================
    # ANALYSIS SERVICE
    # ========================================

    # location /api/analysis/ {
    #     proxy_pass http://analysis/api/analysis/;

    #     proxy_http_version 1.1;

    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # ========================================
    # AI SERVICE
    # ========================================

    # location /api/ai/ {
    #     proxy_pass http://ai/api/ai/;

    #     proxy_http_version 1.1;

    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    #     proxy_buffering off;
    # }

    # ========================================
    # NOTIFICATIONS SERVICE
    # ========================================

    # location /api/notifications/ {
    #     proxy_pass http://notifications/api/notifications/;

    #     proxy_http_version 1.1;

    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # ========================================
    # WEBSOCKET / REALTIME
    # ========================================

    # location /ws/ {
    #     proxy_pass http://realtime/ws/;

    #     proxy_http_version 1.1;

    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;

    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;

    #     proxy_read_timeout 86400;

    #     proxy_buffering off;
    # }

    # ========================================
    # HEALTH CHECKS
    # ========================================

    location /health {
        proxy_pass http://auth/health/;

        proxy_set_header Host $host;
    }

    location /api/health/ {
        proxy_pass http://core/api/health/;

        proxy_set_header Host $host;
    }

    # ========================================
    # NEXT.JS FRONTEND (LOCAL MACHINE)
    # ========================================

    location / {
        proxy_pass http://host.docker.internal:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Next.js HMR support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_cache_bypass $http_upgrade;

        proxy_redirect off;

    }

}

}
