name: OpenSSF Scorecard

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

# Declare default read-only permissions for security
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        # Pinned by SHA, not tag, so the image cannot be swapped under us.
        #
        # v2.4.0 is unusable: that release pulls its image from
        # gcr.io/openssf/scorecard-action, and the pull now fails with
        # "This API method requires billing to be enabled" on the registry
        # project's account. The image moved to ghcr.io in a later release,
        # so the failure was a stale pin, not a broken service. This was
        # failing on dev independently of any branch.
        #
        # v2.4.4 also downgrades a failed results POST to a log line instead
        # of failing the whole job, which the API still does intermittently.
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: results.sarif
