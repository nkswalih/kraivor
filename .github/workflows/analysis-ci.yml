name: Analysis Service CI

on:
  push:
    branches: [main, develop]
    paths:
      - "services/analysis/**"
      - ".github/workflows/analysis-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/analysis/**"

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analysis

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python pin ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check app/ tests/

      - name: Type check with mypy
        run: uv run mypy app/ tests/

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analysis

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python pin ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: services/analysis
          fail_ci_if_error: false
