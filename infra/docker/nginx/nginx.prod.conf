events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Rate Limiting ────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ai:10m rate=5r/s;

    # ── Gzip Compression ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # ── Security Headers ─────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── WebSocket upgrade helper ─────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ── Upstreams ────────────────────────────────────────────
    upstream auth {
        server identity:8001;
    }
    upstream core {
        server core:8002;
    }
    upstream analysis {
        server analysis:8003;
    }
    upstream ai {
        server ai:8004;
    }

    # ── HTTP → HTTPS Redirect ────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Main HTTPS Server ────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.kraivor.com;

        # SSL (Let's Encrypt via certbot)
        ssl_certificate     /etc/letsencrypt/live/api.kraivor.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.kraivor.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS (1 year)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        client_max_body_size 50M;

        # ── Health check ─────────────────────────────────────
        location /health {
            proxy_pass http://auth$request_uri;
            proxy_set_header Host $host;
        }

        # ── Auth Service ─────────────────────────────────────
        location /api/auth/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://auth$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;
            proxy_buffering off;
        }

        # ── Profiles (inside auth) ───────────────────────────
        location /api/profiles/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://auth$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;
            proxy_buffering off;
        }

        # ── Core Service ─────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://core$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
        }

        # ── WebSocket (notifications, realtime) ──────────────
        location /ws/ {
            proxy_pass http://core$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }

        # ── Analysis Service ─────────────────────────────────
        location /api/analysis/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://analysis$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
        }

        # ── AI Service (stricter rate limit for LLM calls) ───
        location /api/ai/ {
            limit_req zone=ai burst=5 nodelay;
            rewrite ^/api/ai/(.*) /$1 break;
            proxy_pass http://ai;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;

            # SSE streaming — no timeout
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── AI Health ────────────────────────────────────────
        location = /api/ai/health {
            proxy_pass http://ai/v1/health;
            proxy_set_header Host $host;
        }

        # ── Core Health ──────────────────────────────────────
        location = /api/health/ {
            proxy_pass http://core$request_uri;
            proxy_set_header Host $host;
        }

        # ── Block dotfiles ───────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
