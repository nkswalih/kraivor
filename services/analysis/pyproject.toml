[project]
name = "kraivor-analysis-service"
version = "0.1.0"
description = "Kraivor Analysis Service — code analysis, tree-sitter parsing, scoring, and production readiness intelligence"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "celery>=5.4.0",
    "redis[hiredis]>=5.0.0",
    "boto3>=1.34.0",
    "tree-sitter>=0.22.0",
    "httpx>=0.27.0",
    "orjson>=3.10.0",
    "structlog>=24.0.0",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "debugpy>=1.8.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httptools>=0.6.0",
]
prod = [
    "uvloop>=0.19.0",
    "httptools>=0.6.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]
skip-magic-trailing-comma = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["app", "workers", "tests"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true
show_error_codes = true
pretty = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "ISC", "ICN", "RUF"]
ignore = [
    "E501",
    "B008",   # FastAPI Depends/Query in arg defaults is idiomatic
    "B904",   # Celery self.retry(exc=exc) is the correct pattern
    "RUF012", # Mutable class defaults for SQLAlchemy/Pydantic models
    "E402",   # Module-level import after settings.get_settings() pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N803"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require database or services)",
    "slow: Tests that take longer than 5 seconds",
]
test_timeout = 60
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app", "workers"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/conftest.py",
]
branch = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 55
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "cryptography>=49.0.0",
]
