name: "✨ Feature Request"
description: Suggest an idea for Kraivor
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea clearly.

  - type: dropdown
    id: service
    attributes:
      label: Affected Area
      description: What part of Kraivor would this feature affect?
      multiple: true
      options:
        - Auth
        - Core
        - Analysis
        - AI
        - Frontend
        - CI/CD
        - Documentation
        - Infrastructure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      placeholder: A new API endpoint that...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternatives have you considered?
      placeholder: I've considered using X instead, but...

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or references

  - type: checkboxes
    id: checklist
    attributes:
      label: Verification
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I have described the problem and proposed solution
          required: true
