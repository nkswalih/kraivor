[project]
name = "core"
version = "0.1.0"
description = "Core service — workspaces, repositories, chat, knowledge, and notifications"
requires-python = ">=3.14"
dependencies = [
    "django>=4.2",
    "djangorestframework>=3.14",
    "psycopg2-binary>=2.9",
    "django-environ>=0.13.0",
    "pyjwt>=2.13.0",
    "cryptography>=48.0.1",
    "requests>=2.31",
    "gunicorn>=21.2.0",
    "celery>=5.3",
    "redis>=5.0",
    "daphne>=4.1",
    "channels>=4.0",
    "channels-redis>=4.0",
    "confluent-kafka>=2.3",
    "boto3>=1.34",
    "django-storages>=1.14",
    "firebase-admin>=6.5",
    "factory-boy>=3.3.3",
    "drf-spectacular>=0.29.0",
    "drf-spectacular-sidecar",
    "python-json-logger>=2.0.0",
    "sentry-sdk>=2.0",
    "django-redis>=5.4",
]

# Dev dependencies live only in [dependency-groups] below (uv's PEP 735
# default group). The former duplicated [project.optional-dependencies].dev
# table was removed so there is a single source of truth.
[dependency-groups]
dev = [
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "flake8-bugbear>=24.0",
    "flake8-builtins>=2.2",
    "flake8-comprehensions>=3.14",
    "flake8-docstrings>=1.7",
    "flake8-import-order>=0.18",
    "pep8-naming>=0.14",
    "mypy>=1.8",
    "django-stubs>=4.2",
    "djangorestframework-stubs>=3.14",
    "pytest>=8.0",
    "pytest-django>=4.12",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "pytest-xdist>=3.5",
    "pytest-sugar>=1.1",
    "factory-boy>=3.3",
    "faker>=22.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.6",
    "tox>=4.14",
    "ruff>=0.3.0",
    "types-requests>=2.31",
    "typing-extensions>=4.9",
    "rich>=13.0",
]

[tool.black]
line-length = 88
target-version = ["py314"]
skip-magic-trailing-comma = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_standard_library = ["typing", "collections", "dataclasses", "enum", "re", "json", "pathlib"]
known_third_party = ["django", "rest_framework", "psycopg2", "environ", "pyjwt", "cryptography", "requests", "gunicorn", "celery", "redis", "daphne", "channels", "confluent_kafka", "boto3", "firebase_admin", "pytest", "factory"]
known_first_party = ["apps", "core"]

[tool.mypy]
strict = true
python_version = "3.14"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apps.*", "core.*"]
ignore_missing_imports = false

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".ruff_cache"]
skips = ["B101", "B105", "B106", "B110", "B301", "B403"]

# Consolidated from the former pytest.ini (which took precedence over this
# table). Values are copied verbatim from pytest.ini so the effective pytest
# configuration is unchanged by the removal of that file.
[tool.pytest.ini_options]
minversion = "9.0"
DJANGO_SETTINGS_MODULE = "core.settings.test"
pythonpath = [".", "apps"]
testpaths = ["tests", "apps"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --tb=short --color=yes -p no:cacheprovider --maxfail=5"
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (multiple components)",
    "security: Security-specific tests",
    "auth: Authentication flow tests",
    "token: Token lifecycle tests",
    "slow: Tests that take longer to run",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/admin.py",
]
branch = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
# Measured 56.35% (2026-09-30) across the full 685-test suite. History: this was
# declared as 90 while the service sat at 39%, so the gate could never have
# passed; it was corrected to 38, then ratcheted to 55 once pytest.ini stopped
# hiding apps/*/tests from collection. Real floor now — it blocks a regression.
fail_under = 55
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "N", "UP", "B", "SIM", "C4", "ISC", "ICN"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N803", "N806", "N814"]
"apps/*/tests/*" = ["N803", "N806", "N814"]
