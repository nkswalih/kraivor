name: Analysis Service CI

on:
  push:
    branches: [main, develop]
    paths:
      - "services/analysis/**"
  pull_request:
    branches: [main]
    paths:
      - "services/analysis/**"

env:
  SERVICE_DIR: services/analysis
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check app/ tests/

      - name: Type check with mypy
        run: uv run mypy app/ --strict

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
        env:
          ANALYSIS_APP_ENV: test
          ANALYSIS_DATABASE__URL: sqlite+aiosqlite:///./test.db
          ANALYSIS_REDIS__URL: redis://localhost:6379/0
          ANALYSIS_CELERY__TASK_ALWAYS_EAGER: "true"

  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run coverage
        run: uv run pytest tests/ --cov=app/ --cov-report=term-missing --cov-fail-under=80
        env:
          ANALYSIS_APP_ENV: test
          ANALYSIS_DATABASE__URL: sqlite+aiosqlite:///./test.db
          ANALYSIS_CELERY__TASK_ALWAYS_EAGER: "true"
