# =============================================================================
# docker-compose.yml — Kraivor Full Stack (Production-like)
# =============================================================================
# Use for: staging, production simulation, full integration testing
#
# Usage:
#   docker-compose up --build -d
#   docker-compose logs -f identity
#   docker-compose down
#   docker-compose down -v   ← also deletes volumes (destructive)
#
# All services use multi-stage production Dockerfiles.
# Secrets come from .env (never committed) or Docker secrets in real prod.
# =============================================================================

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: kraivor-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-kraivor}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kraivor}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    # Postgres tuning — adjust to your host RAM
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c log_min_duration_statement=1000

  redis:
    image: redis:7-alpine
    container_name: kraivor-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-kraivor_redis_2024}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-kraivor_redis_2024}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: kraivor-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    logging:
      driver: "none"
    profiles:
      # Only starts when you explicitly request it:
      # docker-compose --profile dev up
      # In real prod, remove mailhog entirely and use SES
      - dev

  kafka:
    image: apache/kafka:3.9.0
    container_name: kraivor-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes:
      - kafka_data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Application Services ────────────────────────────────────────────────────

  identity:
    build:
      context: ./services/auth
      dockerfile: Dockerfile        # production multi-stage
    container_name: kraivor-identity
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: auth.settings.production
      SECURE_SSL_REDIRECT: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8001:8001"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    volumes:
      # JWT signing keys + OAuth encryption key — not baked into the image
      - ./.keys:/app/.keys
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/api/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # No source volume mount in prod — code is baked into the image
    # No venv volume — venv is in /app/.venv inside the image

  core:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    container_name: kraivor-core
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      DYNAMODB_LOCAL: "true"
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      dynamodb-local:
        condition: service_started
    volumes:
      - ./.keys:/app/.keys:ro
    ports:
      - "8002:8002"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/api/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  analysis:
    build:
      context: ./services/analysis
      dockerfile: Dockerfile
    container_name: kraivor-analysis
    env_file:
      - .env
    environment:
      ANALYSIS_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-kraivor}:${POSTGRES_PASSWORD:-kraivor}@postgres:5432/${POSTGRES_DB:-kraivor}
      ANALYSIS_REDIS__URL: redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/0
      ANALYSIS_CELERY__BROKER__URL: redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1
      ANALYSIS_CELERY__RESULT__BACKEND: redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1
      ANALYSIS_KAFKA__BOOTSTRAP__SERVERS: kafka:9094
      ANALYSIS_IDENTITY__JWKS__URL: http://identity:8001/.well-known/jwks.json
      ANALYSIS_JWT__INTERNAL_REQUEST_SECRET: ${INTERNAL_REQUEST_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8003:8003"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/api/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: kraivor-ai
    env_file:
      - .env
    environment:
      AI_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-kraivor}:${POSTGRES_PASSWORD:-kraivor}@postgres:5432/${POSTGRES_DB:-kraivor}
      AI_REDIS__URL: redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/0
      AI_CELERY__BROKER__URL: redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1
      AI_CELERY__RESULT__BACKEND: redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1
      AI_KAFKA__BOOTSTRAP__SERVERS: kafka:9094
      AI_IDENTITY__JWKS__URL: http://identity:8001/.well-known/jwks.json
      AI_OPENROUTER__MASTER__KEY: ${OPENROUTER_API_KEY}
      AI_KEY_ENCRYPTION_KEY: ${AI_KEY_ENCRYPTION_KEY}
      AI_INTERNAL_REQUEST_SECRET: ${INTERNAL_REQUEST_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8004:8004"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8004/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Core Worker (Celery) ──────────────────────────────────────────────────

  core-worker:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    container_name: kraivor-core-worker
    command: celery -A core.celery_app worker -Q notifications,default --loglevel=info
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped

  core-beat:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    container_name: kraivor-core-beat
    command: celery -A core.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped

  core-consumer:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    container_name: kraivor-core-consumer
    command: python manage.py consume_events
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-kraivor_redis_2024}@redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped

  # ── DynamoDB Local (Chat History) ────────────────────────────────────────

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: kraivor-dynamodb
    ports:
      - "8007:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /data"
    volumes:
      - dynamodb_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kraivor-frontend
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - identity
      - core
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    restart: unless-stopped

  # ── Reverse Proxy ───────────────────────────────────────────────────────────

  nginx:
    image: nginx:1.25-alpine
    container_name: kraivor-nginx
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    volumes:
      - ./infra/docker/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      # Mount SSL certs if you have them (self-signed for local, real certs for prod)
      # - ./infra/docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      identity:
        condition: service_healthy
      core:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    name: kraivor_postgres_data
  redis_data:
    name: kraivor_redis_data
  kafka_data:
    name: kraivor_kafka_data
  dynamodb_data:
    name: kraivor_dynamodb_data