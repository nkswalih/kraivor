name: Kraivor CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  APP_ENV: "test"
  SECRET_KEY: "ci-test-secret-key-not-for-production"
  FRONTEND_URL: "http://localhost:3000"
  JWT_ALGORITHM: "RS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "30"
  # Coverage floors live in each service's pyproject.toml ([tool.coverage.report]
  # fail_under), NOT here, so each service is held to its own honest number.
  # CI only supplies --cov, without which pytest-cov never activates and no
  # report is produced at all.
  # Budget for the coverage-guided fuzzing run. Short on purpose: the gate
  # below is the deterministic corpus check, and libFuzzer keeps its findings
  # in the artifact upload, so this is extra search rather than the contract.
  FUZZ_SECONDS: "60"

jobs:
  format:
    name: Format ${{ matrix.service }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service: [auth, core, ai, analysis]

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          service: ${{ matrix.service }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check format (Black)
        run: uv run black --check --diff . || echo "::warning::Black formatting check failed"

      - name: Check imports (isort)
        run: uv run isort --check-only --diff . || echo "::warning::isort check failed"

  lint:
    name: Lint ${{ matrix.service }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service: [auth, core, ai, analysis]

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          service: ${{ matrix.service }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Lint (Ruff)
        run: uv run ruff check .

  typing:
    name: Typing ${{ matrix.service }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service: [auth, core, ai, analysis]

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          service: ${{ matrix.service }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Type check (MyPy)
        run: uv run mypy . || echo "::warning::MyPy type check found issues"

  security:
    name: Security ${{ matrix.service }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service: [auth, core, ai, analysis]

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          service: ${{ matrix.service }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: SAST (Bandit)
        # No longer `|| true` — bandit findings now fail the build. If a
        # finding is a false positive, add a targeted # nosec with a reason
        # rather than disabling the whole check.
        #
        # `migrations/` is excluded: Alembic revisions run once at deploy
        # against a controlled schema, and their raw SQL interpolates hardcoded
        # seed data, not request input. Skipping B608 globally would also hide
        # genuine findings in application code, so the exclusion is by path.
        run: >
          uv run bandit -r .
          -x ./tests,./.venv,./migrations
          --configfile pyproject.toml -ll

      - name: Dependency audit (pip-audit)
        # Fails on any known vulnerable or yanked dependency.
        if: matrix.service != 'ai'
        run: uv run pip-audit --strict --progress-spinner off

      # `ai` pins CPU-only torch from the PyTorch wheel index, which PyPI does
      # not carry, so `pip-audit` cannot resolve it and aborts with
      # "Dependency not found on PyPI" instead of reporting a result. Auditing
      # the rest of the lock is still worth doing.
      #
      # `--disable-pip` is load-bearing, not a convenience. `uv export` emits
      # `stanza==1.12.2` because pyproject.toml overrides argostranslate's
      # `stanza==1.10.1` pin (GHSA-v5jw-96jm-7h2c, CVE-2026-54499). pip's
      # resolver reads both pins and reports ResolutionImpossible, so the audit
      # dies installing instead of reporting a result. `--disable-pip` skips the
      # install and audits the exported pins directly, which is what we want:
      # `uv export --no-dev` is already a complete transitive pin set, so
      # `--no-deps` loses no coverage.
      #
      # Verified this way: with stanza pinned back to 1.10.1 in the audited file
      # this reports "Found 2 known vulnerabilities in 1 package" and exits 1.
      - name: Dependency audit (pip-audit, torch excluded)
        if: matrix.service == 'ai'
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o /tmp/req.txt
          # Drop the torch requirement and the continuation lines that belong
          # to it, so the remaining pins resolve against PyPI alone.
          python - <<'PY'
          src, dst = "/tmp/req.txt", "/tmp/req-no-torch.txt"
          kept, skip = [], False
          for line in open(src, encoding="utf-8"):
              if line.startswith("torch=="):
                  skip = True
                  continue
              if skip and (line[0] in " \t" or line.startswith("#")):
                  continue
              skip = False
              kept.append(line)
          open(dst, "w", encoding="utf-8").writelines(kept)
          PY
          uv run pip-audit --strict --progress-spinner off \
            --no-deps --disable-pip \
            -r /tmp/req-no-torch.txt

  unit-tests:
    name: Unit Tests ${{ matrix.service }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service: [auth, core, ai, analysis]

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          service: ${{ matrix.service }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure Django settings (auth/core)
        if: matrix.service == 'auth' || matrix.service == 'core'
        run: |
          echo "DJANGO_SETTINGS_MODULE=${{ matrix.service }}.settings.test" >> $GITHUB_ENV
          echo "DATABASE_URL=sqlite://:memory:" >> $GITHUB_ENV

      - name: Generate JWT keys (auth)
        if: matrix.service == 'auth'
        run: |
          mkdir -p .keys
          openssl genrsa -out .keys/jwt-private.pem 2048
          openssl rsa -in .keys/jwt-private.pem -pubout -out .keys/jwt-public.pem
          openssl rand -base64 32 > .keys/oauth-encryption.key

      - name: Run Django migrations (auth/core)
        if: matrix.service == 'auth' || matrix.service == 'core'
        run: uv run python manage.py migrate

      - name: Run tests with coverage
        run: |
          uv run pytest \
            --color=yes --tb=short --maxfail=3 \
            --cov \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml --cov-report=html -q

      - name: Verify the coverage report is real
        # pytest-cov already enforces fail_under, but a percentage cannot tell
        # 27% of a large package apart from 100% of an empty one -- and
        # services/notifications sits at fail_under 90 with every module under
        # app/ a 0-byte file, which passes on a report that measured nothing.
        # This rejects a missing report, one that measured too little to be
        # evidence, and a rate below the floor. It recomputes the percentage
        # the way coverage.py does, branches included, so this number and the
        # one pytest-cov gated on cannot drift apart.
        run: python ../../scripts/check_coverage.py

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit-${{ matrix.service }}
          path: services/${{ matrix.service }}/htmlcov
          retention-days: 7

      - name: Coverage summary
        if: always()
        run: |
          echo "## ${{ matrix.service }} Unit Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # The gate's own output, so the number in this summary and the check
          # that blocks the build are the same computation rather than two
          # reimplementations of it that can disagree.
          python ../../scripts/check_coverage.py >> $GITHUB_STEP_SUMMARY 2>&1 \
            || echo "Coverage check did not pass -- see the job log." \
               >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  integration-tests:
    name: Integration ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs: [format, lint, typing, security]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service: [auth, core, ai, analysis]

    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: kraivor
          POSTGRES_PASSWORD: kraivor
          POSTGRES_DB: kraivor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kraivor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          service: ${{ matrix.service }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure Django PostgreSQL (auth/core)
        if: matrix.service == 'auth' || matrix.service == 'core'
        run: |
          echo "DJANGO_SETTINGS_MODULE=${{ matrix.service }}.settings.test_postgres" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql://kraivor:kraivor@localhost:5432/kraivor_test" >> $GITHUB_ENV

      - name: Configure AI database URL (ai)
        if: matrix.service == 'ai'
        run: echo "AI_DATABASE__URL=postgresql+asyncpg://kraivor:kraivor@localhost:5432/kraivor_test" >> $GITHUB_ENV

      - name: Configure Analysis database URL (analysis)
        if: matrix.service == 'analysis'
        run: echo "ANALYSIS_DATABASE__URL=postgresql+asyncpg://kraivor:kraivor@localhost:5432/kraivor_test" >> $GITHUB_ENV

      - name: Generate JWT keys (auth)
        if: matrix.service == 'auth'
        run: |
          mkdir -p .keys
          openssl genrsa -out .keys/jwt-private.pem 2048
          openssl rsa -in .keys/jwt-private.pem -pubout -out .keys/jwt-public.pem
          openssl rand -base64 32 > .keys/oauth-encryption.key

      - name: Run Django migrations (auth/core)
        if: matrix.service == 'auth' || matrix.service == 'core'
        run: uv run python manage.py migrate

      - name: Run integration tests with coverage
        run: |
          uv run pytest \
            --color=yes --tb=short --maxfail=3 \
            --cov \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml --cov-report=html -q

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-integration-${{ matrix.service }}
          path: services/${{ matrix.service }}/htmlcov
          retention-days: 7

      - name: Coverage summary
        if: always()
        run: |
          echo "## ${{ matrix.service }} Integration Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f coverage.xml ]; then
            python -c "import xml.etree.ElementTree as ET, tomllib; rate = float(ET.parse('coverage.xml').getroot().attrib.get('line-rate', '0')) * 100; floor = tomllib.load(open('pyproject.toml','rb'))['tool']['coverage']['report']['fail_under']; print(f'Line coverage: {rate:.2f}%  (floor: {floor}%)'); print('✅ Meets floor' if rate >= floor else '❌ Below floor')" >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage report generated" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # `next build` runs ESLint as a gate, so this is the only step that
      # catches a lint *error* -- typecheck and vitest both pass with lint
      # errors present. frontend/Dockerfile runs the same command, so without
      # this step the production image was the first place a lint error could
      # fail, and it did.
      - name: Production build
        run: npm run build

  dependency-audit:
    name: Dependency Audit (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit for high/critical vulnerabilities
        # Fails on high or critical. `postcss` currently arrives transitively
        # via next@15 and is only cleared by a next@16 major upgrade, which is
        # tracked as separate work rather than force-applied.
        run: npm audit --audit-level=high

  base-images:
    name: Base images pinned and consistent
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check every base image is digest-pinned
        # Guards the class of drift that let Python 3.11 images, a 3.12 CI
        # interpreter and py311 linter targets coexist. Dependabot keeps the
        # digests current; this stops one being dropped or a tag being rolled
        # back.
        run: python scripts/check_base_images.py

  fuzz:
    name: Fuzz SSRF guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Lint first-party tooling (Ruff)
        # fuzzing/ and scripts/ sit outside every service, so the per-service
        # lint matrix cannot see them. Without this they are the only Python in
        # the repo with no gate on it.
        run: |
          pip install ruff
          ruff check fuzzing/ scripts/

      - name: Check the invariants over the corpus
        # This is the gate. It is deterministic and takes seconds, so a
        # regression fails the build the same way every time. The fuzzing step
        # below is time-limited by design and can only ever add findings.
        run: python fuzzing/fuzz_url_guard.py --iterations 50000

      - name: Install atheris
        # atheris ships native libFuzzer binaries, so it exists only on Linux.
        # That is also why this job cannot run on a Windows runner and why the
        # target carries a pure-Python driver for local use.
        run: pip install atheris

      - name: Fuzz
        # Seed arguments are expanded explicitly rather than passing the
        # directory: libFuzzer takes files, and whether it also accepts a
        # directory has varied between versions.
        run: |
          mkdir -p .fuzz-artifacts
          python fuzzing/fuzz_url_guard.py \
            -max_total_time="${{ env.FUZZ_SECONDS }}" \
            -artifact_prefix=.fuzz-artifacts/ \
            $(find fuzzing/corpus/url_guard -type f | sort)

      - name: Upload any crashers
        # Always runs: a found input is only useful if it survives the run.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: .fuzz-artifacts/
          if-no-files-found: ignore
