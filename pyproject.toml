[tool.black]
line-length = 88
target-version = ["py314"]
skip-magic-trailing-comma = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# Shared lint config for first-party code that lives outside a service:
# scripts/, which includes the fuzz harness in scripts/fuzzing/. Each service
# carries its own [tool.ruff] inside its pyproject.toml, and ruff resolves
# configuration per file from the closest config upward, so this file does not
# change what `ruff check .` reports inside services/.
#
# The rule set matches auth, core and ai. analysis is deliberately stricter
# (it adds I and RUF); that is a per-service decision and is not imposed on
# code that is not part of a service.
#
# Line length is not enforced anywhere in this repo; wrapping is advisory.
[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "N", "UP", "B", "SIM", "C4", "ISC", "ICN"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N803"]

[tool.pytest.ini_options]
addopts = "-v --tb=short --strict-markers -p no:cacheprovider"
test_timeout = 120

[tool.coverage.run]
branch = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
