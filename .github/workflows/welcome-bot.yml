name: Welcome Bot

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  welcome:
    name: Welcome first-time contributor
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@fb2402657b4a28582200150d0a145671d0e50597 # v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Thank you for opening your first issue in **Kraivor**!

            To help us resolve your issue efficiently:
            - Make sure you've filled out all relevant template fields
            - Search existing issues to avoid duplicates
            - Provide steps to reproduce for bug reports

            Useful links:
            - [Contributing Guide](https://github.com/nkswalih/kraivor/blob/dev/CONTRIBUTING.md)
            - [Code of Conduct](https://github.com/nkswalih/kraivor/blob/dev/CODE_OF_CONDUCT.md)
            - [Documentation](https://kraivor.dev/docs)
            - [Community Discussions](https://github.com/nkswalih/kraivor/discussions)

          pr-message: |
            🎉 Thank you for submitting your first pull request to **Kraivor**!

            A maintainer will review your changes shortly. In the meantime:
            - Ensure your PR title follows [Conventional Commits](https://www.conventionalcommits.org/)
            - Verify all CI checks pass
            - Add tests for any new functionality

            Useful links:
            - [Contributing Guide](https://github.com/nkswalih/kraivor/blob/dev/CONTRIBUTING.md)
            - [Code of Conduct](https://github.com/nkswalih/kraivor/blob/dev/CODE_OF_CONDUCT.md)
            - [PR Template](https://github.com/nkswalih/kraivor/blob/dev/.github/PULL_REQUEST_TEMPLATE.md)
