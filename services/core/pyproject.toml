[project]
name = "core"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "django>=4.2",
    "djangorestframework>=3.14",
    "psycopg2-binary>=2.9",
    "django-environ>=0.13.0",
    "pyjwt>=2.8",
    "cryptography>=41.0",
    "requests>=2.31",
    "gunicorn>=21.2.0",
    "celery>=5.3",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.12.0",
    "pytest-cov>=7.1.0",
    "pytest-sugar>=1.1.1",
    "rich>=15.0.0",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings.test"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/admin.py",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false