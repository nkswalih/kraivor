[pytest]
# No apps/ package in this service — all tests live under tests/.
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
filterwarnings = ignore::DeprecationWarning
asyncio_mode = auto
# The Django services register these; without them every `@pytest.mark.unit`
# in this service emits an unknown-mark warning and is silently inert.
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (multiple components)
    security: Security-specific tests
    slow: Tests that take longer to run