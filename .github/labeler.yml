---
# Auto-label pull requests based on changed file paths.
# https://github.com/actions/labeler (v5 syntax)

frontend:
  - changed-files:
      - any: ["frontend/**/*"]

backend:
  - changed-files:
      - any:
          - services/auth/**/*
          - services/core/**/*
          - services/analysis/**/*
          - services/ai/**/*

auth:
  - changed-files:
      - any: ["services/auth/**/*"]

core:
  - changed-files:
      - any: ["services/core/**/*"]

analysis:
  - changed-files:
      - any: ["services/analysis/**/*"]

ai:
  - changed-files:
      - any: ["services/ai/**/*"]

documentation:
  - changed-files:
      - any:
          - docs/**/*
          - "**/*.md"
          - "**/README.md"

ci:
  - changed-files:
      - any: [".github/**/*"]

docker:
  - changed-files:
      - any:
          - Dockerfile*
          - "**/Dockerfile*"
          - docker-compose*
          - "**/.dockerignore"
          - .dockerignore

infrastructure:
  - changed-files:
      - any:
          - infra/**/*
          - k8s/**/*
          - terraform/**/*
          - helm/**/*

dependencies:
  - changed-files:
      - any:
          - services/**/pyproject.toml
          - services/**/uv.lock
          - frontend/package.json
          - frontend/package-lock.json
          - .github/dependabot.yml
